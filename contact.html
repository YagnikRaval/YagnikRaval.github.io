<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Contact — Yagnik Raval</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="brand"><div class="logo">YR</div><div><div style="font-weight:700">Yagnik Raval</div><div style="font-size:.85rem;color:var(--muted)">Writer & Poet</div></div></div>
      <nav class="primary"><a href="/">Home</a><a href="/about.html">About</a><a href="/posts/demo-post.html">Demo Post</a><a href="/contact.html">Contact</a><button class="switch btn" onclick="toggleTheme()"><span class="knob"></span></button></nav>
    </header>

    <main>
      <section class="card post-article">
        <h1>Contact</h1>
        <p class="meta">I'd love to hear from editors, readers, and other writers. Use the form below or email directly.</p>

        <form action="#" onsubmit="alert('Demo: replace with Formspree or backend') ; return false;">
          <label style="display:block;margin-bottom:.5rem">Your name<br><input required style="padding:.5rem;width:100%;max-width:520px;border:1px solid rgba(0,0,0,0.06);border-radius:8px" type="text" name="name"></label>
          <label style="display:block;margin-bottom:.5rem">Your email<br><input required style="padding:.5rem;width:100%;max-width:520px;border:1px solid rgba(0,0,0,0.06);border-radius:8px" type="email" name="email"></label>
          <label style="display:block;margin-bottom:.5rem">Message<br><textarea required style="padding:.5rem;width:100%;max-width:520px;border:1px solid rgba(0,0,0,0.06);border-radius:8px" name="message" rows="6"></textarea></label>
          <button class="btn">Send message</button>
        </form>

        <p style="margin-top:1rem;color:var(--muted)">Or email directly: <a href="mailto:you@example.com">you@example.com</a></p>
      </section>
    </main>

    <footer class="footer">© Yagnik Raval</footer>
  </div>
  <script src="/assets/scripts.js"></script>
</body>
</html>
