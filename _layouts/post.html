---
layout: default
---

<article class="post container">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%B %d, %Y" }}{% if page.tags %} &middot; {% for tag in page.tags %}<a class="tag" href="/tag/{{ tag | slugify }}/">{{ tag }}</a>{% unless forloop.last %}, {% endunless %}{% endfor %}{% endif %}</p>
  </header>

  <section class="content">
    {{ content }}
  </section>

  <footer class="post-footer">
    <p>Share: <a href="https://twitter.com/intent/tweet?text={{ page.title | uri_escape }}%20{{ page.url | absolute_url }}">Twitter</a></p>
  </footer>
</article>
